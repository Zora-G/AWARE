[package]
name = "aware-bn462"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
mcore = { path = "vendor/mcore", features = ["std"] }
openssl = { version = "0.10", features = ["vendored"] }
getrandom = "0.2.16"
rayon = "1.12.0"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
sha2 = "0.10.9"

[features]
benchmarks = []

[[bin]]
name = "aware-bench"
path = "src/bin/aware-bench.rs"
required-features = ["benchmarks"]
