[package]
name = "aware-bn462"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
mcore = { path = "vendor/mcore", features = ["std"] }
openssl = { version = "0.10", features = ["vendored"] }
getrandom = "0.2.16"
rayon = "1.12.0"
blake3 = "1.8"

[features]
benchmarks = []

[[bin]]
name = "aware-bench"
path = "src/bin/aware-bench.rs"
required-features = ["benchmarks"]
